<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WensCloud</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="form-container">

        <h2 class="title">
            Register
        </h2>

        <form id="registerForm">

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    id="registerUsername"
                    required
                >
            </div>

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn"
            >
                Register
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>

    <script src="./js/auth.js"></script>

</body>

</html>
