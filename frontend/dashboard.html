<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WensCloud</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ☁️ WensCloud
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="bots.html">Bots</a>
            <a href="deploy.html">Deploy</a>
            <a href="settings.html">Settings</a>

            <button
                class="btn"
                onclick="logout()"
            >
                Logout
            </button>
        </div>

    </nav>

    <div class="container">

        <h1>
            Dashboard
        </h1>

        <div class="dashboard-grid">

            <div class="stat-card">
                <h2 id="totalBots">
                    0
                </h2>

                <p>Total Bots</p>
            </div>

            <div class="stat-card">
                <h2 id="onlineBots">
                    0
                </h2>

                <p>Online Bots</p>
            </div>

            <div class="stat-card">
                <h2 id="offlineBots">
                    0
                </h2>

                <p>Offline Bots</p>
            </div>

        </div>

        <div class="card">

            <h2>
                Recent Bots
            </h2>

            <table class="table">

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="botsTable">

                </tbody>

            </table>

        </div>

    </div>

    <script src="./js/auth.js"></script>
    <script src="./js/dashboard.js"></script>

</body>

</html>
